# Dependabot version updates. Security updates are switched on separately in
# GitHub: Settings → Code security → Dependabot alerts + Dependabot security updates.
#
# PRs target main (the default branch). Each one gets a Vercel preview and a CI
# run (.github/workflows/ci.yml); merge when both are green. Once merged, the
# change reaches staging on its own via sync-staging.yml.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Bratislava
    # Don't take a release in its first days: most malicious or broken
    # publishes are caught and pulled within that window.
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Packages that must stay on matching versions. Listed first: a package
      # goes to the first group it matches.
      nextjs:
        patterns: ['next', 'eslint-config-next', '@next/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # One PR a week for all other non-breaking bumps, split by risk.
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      # Packages that must move together when they do take a major.
      supabase:
        patterns: ['@supabase/*']
        update-types: [major]
      testing:
        patterns: ['vitest', '@vitest/*', '@vitejs/*', 'jsdom', '@testing-library/*']
        update-types: [major]
    ignore:
      # ESLint 10: wait until eslint-config-next supports it.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeScript majors: 7 (the Go port) drops the JS compiler API that
      # typescript-eslint and next build rely on. Revisit once both support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Tailwind 4 is a rewrite of the config format; also a planned migration.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # linkedom stays pinned to 0.16.11: 0.17+ requires an ESM-only css-select,
      # which breaks recipe import on Vercel's runtime (no require() of ESM).
      # src/lib/scraper/readability.test.ts guards this; lift the pin when it
      # passes on a newer linkedom.
      - dependency-name: linkedom
        versions: ['>=0.17.0']
      # Track the Node major the app runs on, not the newest one.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
