# Read-only checks that production is up after every deploy: the sign-in page
# renders, the API reaches Supabase Auth, the database answers. Vercel reports
# each deploy to GitHub as a deployment; this runs when a Production one succeeds.
# Run it by hand (Actions → Smoke test → Run workflow) against any public URL
# (staging is behind Vercel's deployment protection, so not that one).
name: Smoke test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://dapcook.vercel.app

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # The production domain rather than the deployment's own URL, which Vercel
      # may keep behind its deployment protection.
      - run: npx playwright test -c playwright.smoke.config.ts
        env:
          SMOKE_URL: ${{ inputs.url || 'https://dapcook.vercel.app' }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
