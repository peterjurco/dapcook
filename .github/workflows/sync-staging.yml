# Keeps staging carrying everything on main.
#
# staging is downstream-only: it is main plus whatever features are still being
# tested, and it never merges back. If it ever tangles beyond repair it can be
# reset with `git checkout staging && git reset --hard main && git push --force`,
# then re-merging the feature branches still in flight.
name: Sync main to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Merge main into staging
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "staging already carries main — nothing to do."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit origin/main; then
            git push origin staging
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merged=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report a conflict
        if: failure() && steps.merge.outputs.merged == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'staging is out of sync with main'
            const body = [
              `Merging \`main\` into \`staging\` conflicted, so nothing was pushed and staging is now behind.`,
              '',
              'Resolve it locally:',
              '',
              '```bash',
              'git fetch origin',
              'git checkout staging',
              'git merge origin/main',
              '# resolve, then',
              'git push origin staging',
              '```',
              '',
              'If staging has drifted too far to be worth untangling, reset it — it holds no unique history:',
              '',
              '```bash',
              'git checkout staging && git reset --hard origin/main && git push --force origin staging',
              '```',
              '',
              `Triggered by ${context.sha}.`,
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'staging-sync',
            })

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['staging-sync'],
              })
            }

  migrate:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.github/workflows/migrate-staging.yml
    secrets:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
